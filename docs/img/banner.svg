<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f6fb"/>
      <stop offset="1" stop-color="#e4ecf7"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a78c2"/>
      <stop offset="1" stop-color="#355c9c"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="260" rx="22" fill="url(#bg)"/>

  <!-- Archivador -->
  <g transform="translate(70,40)">
    <rect x="0" y="0" width="140" height="180" rx="12" fill="url(#cab)"/>
    <g fill="#ffffff" fill-opacity="0.95">
      <rect x="14" y="14" width="112" height="44" rx="6"/>
      <rect x="14" y="68" width="112" height="44" rx="6"/>
      <rect x="14" y="122" width="112" height="44" rx="6"/>
    </g>
    <g fill="#355c9c">
      <rect x="52" y="30" width="36" height="8" rx="4"/>
      <rect x="52" y="84" width="36" height="8" rx="4"/>
      <rect x="52" y="138" width="36" height="8" rx="4"/>
    </g>
    <!-- etiquetas de colores en los cajones -->
    <rect x="22" y="44" width="18" height="6" rx="3" fill="#e8a33d"/>
    <rect x="22" y="98" width="18" height="6" rx="3" fill="#3fa37a"/>
    <rect x="22" y="152" width="18" height="6" rx="3" fill="#c25a4a"/>
    <!-- lupa -->
    <g transform="translate(108,118)">
      <circle cx="0" cy="0" r="30" fill="#ffffff" stroke="#1f2937" stroke-width="9"/>
      <circle cx="0" cy="0" r="30" fill="#4a78c2" fill-opacity="0.12"/>
      <line x1="21" y1="21" x2="48" y2="48" stroke="#1f2937" stroke-width="12" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Texto -->
  <text x="290" y="118" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="76" font-weight="700" fill="#1f2937" letter-spacing="-1">archivero</text>
  <text x="293" y="160" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="24" fill="#4b5563">Bring order to years of accumulated files.</text>
  <text x="293" y="196" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="18" fill="#6b7280">Inventory · duplicates · cleanup · reorganizing — read-only</text>
</svg>
